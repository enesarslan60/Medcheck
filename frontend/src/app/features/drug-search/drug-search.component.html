<section class="panel">
  <header class="panel-header">
    <h2>Find drug interactions</h2>
    <p>Add at least two medications to see how they interact.</p>
  </header>

  <div class="panel-body">
    <div class="slot-list">
      <div class="slot" *ngFor="let slot of slots; let i = index">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Drug {{ i + 1 }}</mat-label>
          <input
            type="text"
            matInput
            [formControl]="slot.control"
            [matAutocomplete]="auto"
            (input)="onInputChange(slot)"
            placeholder="e.g. Ibuprofen" />
          <mat-icon matSuffix *ngIf="!slot.selected">search</mat-icon>
          <mat-icon
            matSuffix
            *ngIf="slot.selected"
            class="selected-check"
            aria-label="selected">check_circle</mat-icon>
          <mat-autocomplete
            #auto="matAutocomplete"
            [displayWith]="displayDrug"
            (optionSelected)="onSelect(slot, $event)">
            <mat-option *ngFor="let drug of slot.suggestions$ | async" [value]="drug">
              <strong>{{ drug.name }}</strong>
              <span class="suggestion-substance"> — {{ drug.activeSubstance }}</span>
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <button
          mat-icon-button
          color="warn"
          class="slot-remove"
          (click)="removeSlot(i)"
          [disabled]="slots.length <= 2"
          [attr.aria-label]="'Remove drug ' + (i + 1)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>

    <button mat-stroked-button color="primary" (click)="addSlot()" class="add-button">
      <mat-icon>add</mat-icon>
      Add drug
    </button>

    <p class="hint">{{ selectedCount }} of {{ slots.length }} slots filled.</p>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <footer class="panel-footer">
    <button
      mat-flat-button
      color="primary"
      (click)="check()"
      [disabled]="loading || selectedCount < 2">
      <mat-icon>medical_services</mat-icon>
      Check Interactions
    </button>
    <mat-progress-spinner
      *ngIf="loading"
      mode="indeterminate"
      diameter="24">
    </mat-progress-spinner>
  </footer>
</section>
