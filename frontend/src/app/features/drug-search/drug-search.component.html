<section class="panel">
  <header class="panel-header">
    <h2>Find drug interactions</h2>
    <p>Add at least two medications to see how they interact.</p>
  </header>

  <div class="panel-body">
    <div class="slot-list">
      <div class="slot" *ngFor="let slot of slots; let i = index">
        <label class="slot-field">
          <span class="slot-label">Drug {{ i + 1 }}</span>

          <div class="input-wrap">
            <input
              type="text"
              class="text-input"
              autocomplete="off"
              [formControl]="slot.control"
              (focus)="onFocus(slot)"
              (blur)="onBlur(slot)"
              (input)="onInputChange(slot)"
              (keydown)="onKeydown(slot, $event)"
              placeholder="e.g. Ibuprofen" />

            <span class="input-icon" *ngIf="slot.selected" aria-label="selected">✓</span>

            <ul class="suggestions" *ngIf="slot.open && slot.suggestions.length">
              <li
                *ngFor="let drug of slot.suggestions; let idx = index"
                [class.active]="idx === slot.activeIndex"
                (mousedown)="selectDrug(slot, drug)">
                <strong>{{ drug.name }}</strong>
                <span class="suggestion-substance"> — {{ drug.activeSubstance }}</span>
              </li>
            </ul>
          </div>
        </label>

        <button
          type="button"
          class="btn-icon"
          (click)="removeSlot(i)"
          [disabled]="slots.length <= 2"
          [attr.aria-label]="'Remove drug ' + (i + 1)">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M6 7h12l-1 13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 7zm3-3h6l1 2h4v2H5V6h4l1-2z"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="button" class="btn-outline add-button" (click)="addSlot()">
      + Add drug
    </button>

    <p class="hint">{{ selectedCount }} of {{ slots.length }} slots filled.</p>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <footer class="panel-footer">
    <span class="spinner" *ngIf="loading" aria-label="loading"></span>
    <button
      type="button"
      class="btn-primary"
      (click)="check()"
      [disabled]="loading || selectedCount < 2">
      Check Interactions
    </button>
  </footer>
</section>
