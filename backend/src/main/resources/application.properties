spring.application.name=drug-checker
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:drugdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Seed data
spring.sql.init.mode=always

# Anthropic Claude API
anthropic.api.key=${ANTHROPIC_API_KEY:}

# External data sources
rxnorm.base-url=https://rxnav.nlm.nih.gov/REST
openfda.base-url=https://api.fda.gov
openfda.api-key=${OPENFDA_API_KEY:}

# Logging
logging.level.com.drugchecker=INFO
