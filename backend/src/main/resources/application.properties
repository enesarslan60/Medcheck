spring.application.name=drug-checker
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:drugdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Seed data
spring.sql.init.mode=always

# LLM provider — "anthropic" (default), "gemini" or "ollama"
llm.provider=${LLM_PROVIDER:anthropic}

# Anthropic Claude API
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=https://api.anthropic.com
anthropic.model=claude-sonnet-4-5-20250929
anthropic.max-tokens=512
anthropic.timeout-seconds=15

# Google Gemini API (free tier, 1500 req/day for Flash)
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-2.5-flash
gemini.max-tokens=512
gemini.timeout-seconds=15

# Ollama (local LLM — no key, no quota; start Ollama and run `ollama pull llama3.1:8b`)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.1:8b}
ollama.max-tokens=512
# CPU-only inference on large openFDA texts can take a while — 3 min ceiling.
ollama.timeout-seconds=180

# External data sources
rxnorm.base-url=https://rxnav.nlm.nih.gov/REST
openfda.base-url=https://api.fda.gov
openfda.api-key=${OPENFDA_API_KEY:}

# Logging
logging.level.com.drugchecker=INFO
